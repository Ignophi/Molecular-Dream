name: Build and deploy paper

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build ar5iv-style HTML
        run: |
          mkdir -p _site
          docker run --rm \
            -v "$PWD":/docdir \
            -w /docdir \
            --user "$(id -u):$(id -g)" \
            latexml/ar5ivist:2512.17 \
            --source=main.tex \
            --destination=_site/index.html

      # Keep the original raster figures available at the same relative paths
      # used by the LaTeX source. This is harmless if LaTeXML has already
      # copied them and makes deployment robust across converter versions.
      - name: Copy static assets
        run: |
          mkdir -p _site/figures
          cp -f figures/* _site/figures/
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
